<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luqma WhatsApp Demo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body>
<style>.conversation{background-color:#efeae2;background-image:linear-gradient(#efeae244,#efeae244),url('assets/chat-background.png');background-size:cover,420px auto;background-repeat:repeat,repeat;background-position:center,center}.device-status{display:flex;align-items:center;gap:7px}.network-icon,.wifi-icon{font-style:normal;font-size:14px}.battery{width:22px;height:11px;border:1px solid #d7efea;border-radius:3px;padding:1px;display:inline-block;position:relative}.battery:after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#d7efea;border-radius:0 2px 2px 0}.battery i{display:block;height:100%;width:0;background:#d7efea;border-radius:1px;transition:width .3s}.battery i.charging{background:#52d273}</style><main class="stage"><section class="pitch"><span>WHATSAPP CATALOG DEMO</span><h1>Order like<br><b>you chat.</b></h1><p>A WhatsApp-style ordering journey for Luqma. Browse products, build a cart, and send the order in a few taps.</p><div class="brand">لقمة <i>•</i></div></section>
<section class="phone"><header><div class="status-bar"><span id="deviceTime">--:--</span><span class="device-status"><i class="network-icon">⌁</i><i class="wifi-icon">⌁</i><span class="battery"><i id="batteryLevel"></i></span><span id="batteryText">--%</span></span></div><div class="chat-header"><button id="back" class="back-button">‹</button><div class="contact"><div class="avatar">ل</div><div><b>Luqma - لقمة</b><small><i></i> online</small></div></div><div class="header-actions"><button aria-label="Video call">▣</button><button aria-label="Call">⌕</button><button id="resetChat" aria-label="Restart conversation" title="Restart conversation">⋮</button></div></div></header><div id="conversation" class="conversation"></div><div id="screen" class="screen"></div></section>
<aside class="steps"><span>THE FLOW</span><h2>From menu<br>to cart.</h2><p><b>01</b> Open the catalog</p><p><b>02</b> Choose quantities</p><p><b>03</b> Send the cart</p></aside></main><div id="toast"></div><script src="app.js"></script></body></html>
